<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniCraft in GitHub Pages</title>
  <style>
    :root {
      --panel: rgba(15, 20, 25, 0.48);
      --panel-border: rgba(255,255,255,0.18);
      --text: #f2f7ff;
      --accent: #8fe38d;
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #7cc7ff;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body { position: relative; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      font-size: 14px;
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      opacity: 0.9;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 6px rgba(0,0,0,0.35);
    }

    #crosshair::before {
      left: 8px; top: 0; width: 2px; height: 18px;
    }

    #crosshair::after {
      left: 0; top: 8px; width: 18px; height: 2px;
    }

    #info {
      position: absolute;
      left: 16px;
      top: 16px;
      padding: 10px 14px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      box-shadow: 0 8px 24px var(--shadow);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      line-height: 1.5;
      text-shadow: 0 2px 0 rgba(0,0,0,0.25);
    }

    #info strong {
      font-size: 16px;
      color: #fff;
    }

    #rightPanel {
      position: absolute;
      right: 16px;
      top: 16px;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      box-shadow: 0 8px 24px var(--shadow);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      min-width: 170px;
    }

    #blockName {
      display: inline-block;
      min-width: 80px;
      color: var(--accent);
      font-weight: 700;
    }

    #message {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 20px var(--shadow);
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      text-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }

    #message.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="info">
      <strong>MiniCraft</strong><br>
      WASD move • Space jump • Mouse look<br>
      Left click: break block • Right click: place block<br>
      Keys 1-4: switch block type
    </div>

    <div id="rightPanel">
      Block: <span id="blockName">Grass</span>
    </div>

    <div id="crosshair"></div>
    <div id="message">Click to start</div>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.155.0/build/three.module.js';
    import { PointerLockControls } from 'https://unpkg.com/three@0.155.0/examples/jsm/controls/PointerLockControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8ecbff);
    scene.fog = new THREE.Fog(0x8ecbff, 18, 60);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 12, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new PointerLockControls(camera, document.body);
    scene.add(controls.getObject());

    const hemi = new THREE.HemisphereLight(0xffffff, 0x567d3b, 0.9);
    hemi.position.set(0, 50, 0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(20, 30, 10);
    scene.add(sun);

    const blockMaterialMap = {
      Grass: new THREE.MeshStandardMaterial({ map: makeTexture('#6ecf5e', '#4c8d36') }),
      Dirt: new THREE.MeshStandardMaterial({ map: makeTexture('#8b5a2b', '#633d1d') }),
      Stone: new THREE.MeshStandardMaterial({ map: makeTexture('#8d99a6', '#606a73') }),
      Wood: new THREE.MeshStandardMaterial({ map: makeTexture('#b58145', '#7e4f24') }),
      Sand: new THREE.MeshStandardMaterial({ map: makeTexture('#e7d592', '#c6b26f') })
    };

    const blockTypes = ['Grass', 'Dirt', 'Stone', 'Wood'];
    let activeBlock = 'Grass';
    const blockMeshes = [];
    const blocks = new Map();
    const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);

    const hudBlockName = document.getElementById('blockName');
    const message = document.getElementById('message');

    function makeTexture(base, detail) {
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, 32, 32);
      for (let i = 0; i < 300; i++) {
        const x = Math.random() * 32;
        const y = Math.random() * 32;
        const s = 1 + Math.random() * 3;
        ctx.fillStyle = detail;
        ctx.fillRect(x, y, s, s);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      return tex;
    }

    function setActiveBlock(name) {
      activeBlock = name;
      hudBlockName.textContent = name;
    }

    function showMessage(text) {
      message.textContent = text;
      message.classList.add('show');
      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => message.classList.remove('show'), 1200);
    }

    function blockKey(x, y, z) {
      return `${x},${y},${z}`;
    }

    function addBlock(x, y, z, type = 'Grass') {
      const key = blockKey(x, y, z);
      if (blocks.has(key)) return;

      const mesh = new THREE.Mesh(cubeGeometry, blockMaterialMap[type] || blockMaterialMap.Grass);
      mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
      mesh.castShadow = false;
      mesh.receiveShadow = false;
      scene.add(mesh);
      blocks.set(key, { x, y, z, mesh, type });
      blockMeshes.push(mesh);
    }

    function removeBlock(x, y, z) {
      const key = blockKey(x, y, z);
      const block = blocks.get(key);
      if (!block) return;
      scene.remove(block.mesh);
      blocks.delete(key);
      const idx = blockMeshes.indexOf(block.mesh);
      if (idx !== -1) blockMeshes.splice(idx, 1);
    }

    function terrainHeightAt(x, z) {
      const base = Math.floor(4 + Math.sin(x * 0.8) * 2.5 + Math.cos(z * 0.9) * 2.2);
      return Math.max(0, base);
    }

    function generateWorld() {
      for (let x = -14; x <= 14; x++) {
        for (let z = -14; z <= 14; z++) {
          const h = terrainHeightAt(x, z);
          for (let y = 0; y <= h; y++) {
            let type = 'Stone';
            if (y === h) type = 'Grass';
            else if (y >= h - 2) type = 'Dirt';
            addBlock(x, y, z, type);
          }
        }
      }

      const treePositions = [
        [-3, -4], [4, 6], [8, -2], [-9, 7], [2, 10]
      ];

      for (const [tx, tz] of treePositions) {
        const h = terrainHeightAt(tx, tz);
        const trunkH = 3;
        for (let i = 0; i < trunkH; i++) {
          addBlock(tx, h + i + 1, tz, 'Wood');
        }
        for (let dx = -2; dx <= 2; dx++) {
          for (let dy = 0; dy <= 2; dy++) {
            for (let dz = -2; dz <= 2; dz++) {
              if (Math.abs(dx) + Math.abs(dz) + dy < 5) {
                addBlock(tx + dx, h + trunkH + dy, tz + dz, 'Grass');
              }
            }
          }
        }
      }
    }

    generateWorld();

    const movement = {
      forward: false,
      backward: false,
      left: false,
      right: false,
      jump: false
    };

    const playerVelocity = new THREE.Vector3();
    const playerDirection = new THREE.Vector3();
    const playerPosition = controls.getObject().position;
    const playerHeight = 1.75;
    let onGround = false;

    function keyForBlock(x, y, z) {
      return `${x},${y},${z}`;
    }

    function getGroundHeightAt(x, z) {
      let highest = -1;
      for (let y = 0; y <= 20; y++) {
        if (blocks.has(keyForBlock(Math.floor(x), y, Math.floor(z)))) {
          highest = y;
        }
      }
      return highest + 1;
    }

    function updateMovement(delta) {
      const speed = 7.5;
      const jumpSpeed = 7.5;
      const damping = 10;

      playerVelocity.x -= playerVelocity.x * damping * delta;
      playerVelocity.z -= playerVelocity.z * damping * delta;
      playerVelocity.y -= 18 * delta;

      if (movement.forward) playerVelocity.z -= speed * delta;
      if (movement.backward) playerVelocity.z += speed * delta;
      if (movement.left) playerVelocity.x -= speed * delta;
      if (movement.right) playerVelocity.x += speed * delta;

      if (movement.jump && onGround) {
        playerVelocity.y = jumpSpeed;
        onGround = false;
      }

      playerDirection.set(0, 0, 0);
      if (movement.forward || movement.backward || movement.left || movement.right) {
        playerDirection.z = Number(movement.forward) - Number(movement.backward);
        playerDirection.x = Number(movement.right) - Number(movement.left);
        playerDirection.normalize();
      }

      controls.moveRight(-playerVelocity.x * delta);
      controls.moveForward(-playerVelocity.z * delta);
      playerPosition.y += playerVelocity.y * delta;

      const footX = Math.floor(playerPosition.x);
      const footZ = Math.floor(playerPosition.z);
      const groundY = getGroundHeightAt(playerPosition.x, playerPosition.z) + 0.15;

      if (playerPosition.y < groundY + playerHeight) {
        playerPosition.y = groundY + playerHeight;
        playerVelocity.y = 0;
        onGround = true;
      } else {
        onGround = false;
      }

      playerPosition.x = THREE.MathUtils.clamp(playerPosition.x, -50, 50);
      playerPosition.z = THREE.MathUtils.clamp(playerPosition.z, -50, 50);
      if (playerPosition.y < -10) {
        playerPosition.set(0, 12, 8);
        playerVelocity.set(0, 0, 0);
      }
    }

    document.addEventListener('keydown', (event) => {
      if (event.code === 'KeyW') movement.forward = true;
      if (event.code === 'KeyS') movement.backward = true;
      if (event.code === 'KeyA') movement.left = true;
      if (event.code === 'KeyD') movement.right = true;
      if (event.code === 'Space') movement.jump = true;

      if (event.code.startsWith('Digit')) {
        const index = Number(event.code.replace('Digit', '')) - 1;
        if (index >= 0 && index < blockTypes.length) {
          setActiveBlock(blockTypes[index]);
          showMessage(`Selected ${blockTypes[index]}`);
        }
      }
    });

    document.addEventListener('keyup', (event) => {
      if (event.code === 'KeyW') movement.forward = false;
      if (event.code === 'KeyS') movement.backward = false;
      if (event.code === 'KeyA') movement.left = false;
      if (event.code === 'KeyD') movement.right = false;
      if (event.code === 'Space') movement.jump = false;
    });

    document.body.addEventListener('click', () => {
      if (!controls.isLocked) {
        controls.lock();
      }
    });

    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
    renderer.domElement.addEventListener('mousedown', (event) => {
      if (!controls.isLocked) return;

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(
        (event.clientX / window.innerWidth) * 2 - 1,
        -(event.clientY / window.innerHeight) * 2 + 1
      );

      raycaster.setFromCamera(mouse, camera);
      const intersections = raycaster.intersectObjects(blockMeshes, false);
      if (!intersections.length) return;

      const hit = intersections[0];
      const hitPoint = hit.point.clone();
      const normal = hit.face.normal.clone();
      const blockPos = hitPoint.clone().addScaledVector(normal, -0.01);
      const bx = Math.floor(blockPos.x);
      const by = Math.floor(blockPos.y);
      const bz = Math.floor(blockPos.z);

      if (event.button === 0) {
        removeBlock(bx, by, bz);
        showMessage('Block removed');
      } else if (event.button === 2) {
        const placePos = hitPoint.clone().addScaledVector(normal, 0.51);
        const px = Math.floor(placePos.x);
        const py = Math.floor(placePos.y);
        const pz = Math.floor(placePos.z);

        if (!blocks.has(blockKey(px, py, pz))) {
          addBlock(px, py, pz, activeBlock);
          showMessage(`Placed ${activeBlock}`);
        }
      }
    });

    setActiveBlock(activeBlock);
    camera.position.set(0, 12, 8);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      updateMovement(delta);
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
